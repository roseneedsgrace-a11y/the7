<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { 
      --primary: #741b47;
      --secondary: #cbd5e1;
      --bg: #f8fafc;
      --panel: #ffffff;
      --text: #1e293b;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background: var(--bg); 
      color: var(--text);
      padding-bottom: 60px;
    }

    .site-header {
      background: #741b47;
      width: 100%;
      height: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .site-header h1 {
      font-family: 'Cinzel Decorative', serif;
      color: #f9e7f0;
      font-size: clamp(1.2rem, 5vw, 2.5rem);
      text-align: center;
      font-weight: 400;
      line-height: 1.3;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      padding: 20px;
      background: white;
      border-bottom: 1px solid #e2e8f0;
      flex-wrap: wrap;
    }

    select, input {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 14px;
    }

    .week-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Mobile Responsive */
    @media (max-width: 1000px) {
      .week-grid { grid-template-columns: 1fr; }
    }

    .day-column {
      background: #f1f5f9;
      border-radius: 12px;
      padding-bottom: 10px;
      min-height: 200px;
    }

    .day-header {
      background: var(--primary);
      color: white;
      padding: 12px;
      border-radius: 12px 12px 0 0;
      text-align: center;
    }

    .day-header h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
    .day-header span { font-size: 12px; opacity: 0.8; }

    .task-card {
      background: white;
      margin: 10px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      position: relative;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .task-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .task-card.is-done { opacity: 0.5; background: #f8fafc; }

    .task-subject { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--primary); margin-bottom: 4px; }
    .task-text { font-size: 13px; color: #334155; line-height: 1.4; }
    .task-card.is-done .task-text { text-decoration: line-through; }

    .task-check { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

    .print-btn {
      background: #475569;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    @media print {
      .controls, .site-header { display: none; }
      .week-grid { grid-template-columns: repeat(5, 1fr); gap: 5px; }
      .day-column { border: 1px solid #ccc; }
    }
  </style>
</head>
<body>

<div class="site-header">
  <h1 id="headerTitle">Thus Far the Lord<br>Has Helped Us</h1>
</div>

<div class="controls">
  <select id="studentSelect" onchange="renderWeek()"></select>
  <div style="display:flex; align-items:center; gap:8px;">
    <strong>Week:</strong>
    <input type="number" id="weekInput" min="1" max="36" onchange="renderWeek()">
  </div>
  <button class="print-btn" onclick="window.print()">Print Week</button>
  <a href="parents.html" style="font-size: 12px; color: #64748b;">Parent Dashboard</a>
</div>

<div id="content" class="week-grid"></div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbxWveKXenQGLmeJyhNZCJUrsOEvrDNYGBiIEKEMgKA1kD6Vyn708lXL3rqOsoiYkbYn/exec';
  let allData = null;

  window.onload = function() {
    fetch('data.json?v=' + new Date().getTime())
      .then(r => r.json())
      .then(data => {
        allData = data;
        
        // Populate Student Dropdown
        const sel = document.getElementById('studentSelect');
        data.studentData.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.student; opt.textContent = s.student;
          sel.appendChild(opt);
        });

        // Set initial week
        document.getElementById('weekInput').value = data.config.currentWeek || 35;
        
        renderWeek();
      });
  };

  function renderWeek() {
    if (!allData) return;
    
    const studentName = document.getElementById('studentSelect').value;
    const weekNum = parseInt(document.getElementById('weekInput').value);
    const content = document.getElementById('content');
    
    const student = allData.studentData.find(s => s.student === studentName);
    if (!student) return;

    // Update colors based on student palette
    document.documentElement.style.setProperty('--primary', student.palette.primary);
    document.documentElement.style.setProperty('--secondary', student.palette.secondary);

    // Calculate Monday of this week
    // We use the "anchor" date from the JSON to find the Monday of the selected week
    const anchorDate = new Date(allData.date + ", 2026");
    const anchorWeek = allData.config.currentWeek || 35;
    const weekDiff = weekNum - anchorWeek;
    
    const dayIdx = anchorDate.getDay();
    const diffToMon = (dayIdx === 0 ? -6 : 1 - dayIdx);
    const monday = new Date(anchorDate);
    monday.setDate(anchorDate.getDate() + diffToMon + (weekDiff * 7));

    let html = '';
    const dayNames = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];

    for (let i = 0; i < 5; i++) {
      const currentDay = new Date(monday);
      currentDay.setDate(monday.getDate() + i);
      const targetMidnight = Date.UTC(currentDay.getFullYear(), currentDay.getMonth(), currentDay.getDate());
      
      const dateLabel = currentDay.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

      html += `<div class="day-column">
        <div class="day-header" style="background:${student.palette.primary}">
          <h2>${dayNames[i]}</h2>
          <span>${dateLabel}</span>
        </div>
        <div class="day-tasks">`;

      // Filter tasks for THIS student and THIS day
      let dailyTasks = [];
      student.grid.forEach(subject => {
        subject.tasks.forEach(t => {
          const d = new Date(t.rawDate);
          const taskMidnight = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
          
          if (taskMidnight === targetMidnight && t.task && t.task.trim() !== "") {
            dailyTasks.push({ ...t, subject: subject.subject });
          }
        });
      });

      if (dailyTasks.length === 0) {
        html += `<div style="padding:20px; text-align:center; color:#94a3b8; font-size:12px;">No tasks</div>`;
      } else {
        dailyTasks.forEach(t => {
          html += `
            <div class="task-card ${t.done ? 'is-done' : ''}" id="card-${t.id}">
              <div class="task-subject">${t.subject}</div>
              <div class="task-text">${t.task}</div>
              <input type="checkbox" class="task-check" ${t.done ? 'checked' : ''} 
                onchange="toggleTask('${t.id}', this)">
            </div>`;
        });
      }

      html += `</div></div>`;
    }
    
    content.innerHTML = html;
  }

  function toggleTask(id, el) {
    const card = document.getElementById('card-' + id);
    if (card) card.classList.toggle('is-done', el.checked);
    
    // Update local data
    allData.studentData.forEach(s => {
      s.grid.forEach(row => {
        row.tasks.forEach(t => { if(t.id === id) t.done = el.checked; });
      });
    });
    
    fetch(`${API_URL}?action=toggle&key=${encodeURIComponent(id)}&status=${el.checked}`, { mode: 'no-cors' });
  }
</script>
</body>
</html>
